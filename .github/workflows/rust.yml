# .github/workflows/daily-rust-build.yml

name: Daily Rust Build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * *"  # every day at 18:30 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    # Add permissions for the GITHUB_TOKEN to allow pushing changes
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build project
        run: cargo build --release

      - name: Run project to update files
        env:
          # Your secrets are still passed securely
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: cargo run --release

      # This single action replaces all your manual git steps
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Optional: Customize the commit message
          commit_message: "📝 Auto-update from GitHub Actions"
          # Optional: Specify the branch to push to
          branch: main
