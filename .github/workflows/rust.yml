name: Daily Rust Build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * *"  # every day at 18:30 UTC
  workflow_dispatch:

# A push-triggered run and the scheduled run must not race each other on `git push`.
concurrency:
  group: readme-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Update stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: cargo run --release

      # Also runs after a failed update so the partially refreshed LOC cache is
      # kept and the next run resumes instead of starting over.
      - name: Commit and push changes
        if: ${{ !cancelled() }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📝 Auto-update from GitHub Actions"
          branch: main
