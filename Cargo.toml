[package]
name = "AdnanKhan-ak47"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
hex = "0.4.3"
parking_lot = "0.12"
reqwest = {version = "0.12.15", features = ["blocking", "json"]}
serde_json = "1.0.140"
sha2 = "0.10.9"
# Sorted attributes keep SVG output byte-stable between runs (the default
# HashMap reshuffles them, producing noisy daily diffs).
xmltree = { version = "0.11.0", features = ["attribute-sorted"] }
